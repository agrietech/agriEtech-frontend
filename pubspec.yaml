name: EthioFarm
description: "EthioFarm Smart Farming System- Flutter Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.0.1

  # Networking & Real-time
  dio: ^5.4.3+1
  socket_io_client: ^3.0.1

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # Maps & Geospatial
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Storage & Offline Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.1
  connectivity_plus: ^6.0.3
  workmanager: ^0.9.0

  # Media & Imaging
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.3.0

  # Push Notifications
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^17.0.0

  # Permissions & System
  permission_handler: ^11.3.1
  intl: ^0.20.2
  flutter_dotenv: ^5.1.0
  equatable: ^2.0.5
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.8

  # Serialization Annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  # Audio & Voice Processing
  audioplayers: ^6.8.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.5
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  adaptive_icon_background: "#065F46"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48

flutter_native_splash:
  color: "#065F46"
  image: "assets/icons/app_icon.png"
  android_12:
    color: "#065F46"
    image: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/weather/
    - assets/icons/
    - assets/fonts/
    - .env

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic