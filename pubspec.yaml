name: agrietech
description: "AgriEtech Multi-Hazard Early Warning Platform - Flutter Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.0.1

  # Networking & Real-time
  dio: ^5.4.3+1
  socket_io_client: ^3.0.1

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # Maps & Geospatial
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Storage & Offline Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.1
  connectivity_plus: ^6.0.3
  workmanager: ^0.5.2

  # Media & Imaging
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.3.0

  # Push Notifications
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1
  flutter_local_notifications: ^17.0.0

  # Permissions & System
  permission_handler: ^11.3.1
  intl: ^0.20.2
  flutter_dotenv: ^5.1.0
  equatable: ^2.0.5
  url_launcher: ^6.2.6

  # Serialization Annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
