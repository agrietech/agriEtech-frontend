        * {
            box-sizing: border-box;

            padding: 0;

        body {

            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        #loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background: radial-gradient( circle at 50% 38%, #1b5e20 0%, #0d2e14 55%, #071a0b 100%);
            z-index: 99999;
            transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
        }
        
        #loading-container.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .brand-glow {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .brand-glow::before {
            content: "";
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient( circle, rgba(245, 158, 11, 0.25) 0%, rgba(74, 222, 128, 0.15) 45%, transparent 70%);
            border-radius: 50%;
            filter: blur(16px);
            animation: pulseGlow 2.4s infinite alternate ease-in-out;
        }
        
        .brand-icon {
            width: 88px;
            height: 88px;
            background: linear-gradient( 135deg, #1b5e20 0%, #2e7d32 50%, #14532d 100%);
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid rgba(245, 158, 11, 0.55);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), 0 0 20px rgba(245, 158, 11, 0.2);
            position: relative;
            z-index: 1;
            transform: translateY(0);
            animation: floatBadge 3s ease-in-out infinite alternate;
        }
        
        .brand-icon svg {
            width: 54px;
            height: 54px;
        }
        
        .brand-title {
            margin-top: 24px;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .title-agri {
            color: #a5d6a7;
            font-weight: 700;
        }
        
        .title-e {
            color: #f59e0b;
            font-weight: 900;
            font-size: 35px;
            margin: 0 1px;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
        }
        
        .title-tech {
            color: #4ade80;
            font-weight: 800;
        }
        
        .brand-badge {
            margin-top: 8px;
            padding: 4px 14px;
            background: rgba(46, 125, 50, 0.35);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #86efac;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
        }
        
        .spinner-wrapper {
            margin-top: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(74, 222, 128, 0.2);
            border-top-color: #f59e0b;
            border-right-color: #4ade80;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        @keyframes floatBadge {
            0% {
                transform: translateY(0px) scale(1);
            }
            100% {
                transform: translateY(-4px) scale(1.02);
            }
        }
        
        @keyframes pulseGlow {
            0% {
                opacity: 0.5;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1.15);
            }
        }
    </style>

        .bottom {
            position: absolute;
            bottom: 0;
            left: 50%;

        .bottomLeft {

    <script>
        function hideLoader() {
            const loader = document.getElementById("loading-container");
            if (loader && !loader.classList.contains("fade-out")) {
                loader.classList.add("fade-out");
                setTimeout(() => {
                    if (loader.parentNode) loader.parentNode.removeChild(loader);
                }, 380);
            }
        }

        // 1. Flutter engine first frame event
        window.addEventListener("flutter-first-frame", hideLoader);

        // 2. Safety timeout (ensures the loader NEVER stays stuck even on slow networks or errors)
        setTimeout(hideLoader, 2500);
    </script>
